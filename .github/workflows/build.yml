name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j2

      - name: Check Python syntax
        run: |
          python3 -m py_compile \
            tools/loadgen.py \
            tools/seed_data.py \
            tools/analyze.py \
            tools/queue_plots.py

      - name: Check shell syntax
        run: bash -n scripts/run_normal.sh scripts/run_brownout.sh scripts/run_local_demo.sh scripts/run_local_brownout.sh
