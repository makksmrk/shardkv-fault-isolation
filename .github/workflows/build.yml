name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j2

      - name: Check Python syntax
        run: |
          python3 -m py_compile \
            loadgen.py \
            seed_data.py \
            analyze.py \
            queue_plots.py

      - name: Check shell syntax
        run: bash -n run_normal.sh run_brownout.sh run_local_demo.sh run_local_brownout.sh
